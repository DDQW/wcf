[workspace]
resolver = "2"
members = ["crates/shared", "crates/backend", "crates/app", "crates/server"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
shared = { path = "crates/shared" }
backend = { path = "crates/backend" }
app = { path = "crates/app" }

leptos = "0.8"
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"

axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }

sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v7", "js"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
pulldown-cmark = "0.13"
ammonia = "4"
base64 = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "pool",
    "hostname",
    "builder",
    "tokio1-rustls-tls",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Small WASM bundle for the browser; the server binary keeps opt-level 3.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[[workspace.metadata.leptos]]
name = "woelkicommunityframework"
bin-package = "server"
lib-package = "app"
output-name = "woelkicommunityframework"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "assets"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
lib-features = ["hydrate"]
bin-features = []
lib-profile-release = "wasm-release"
