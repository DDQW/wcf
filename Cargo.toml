[workspace]
resolver = "2"
members = ["crates/shared", "crates/app", "crates/server"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
shared = { path = "crates/shared" }
app = { path = "crates/app" }

leptos = "0.8"
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"

axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }

sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v7", "js"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
pulldown-cmark = "0.13"
base64 = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[[workspace.metadata.leptos]]
name = "woelkicommunityframework"
bin-package = "server"
lib-package = "app"
output-name = "woelkicommunityframework"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "assets"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
lib-features = ["hydrate"]
