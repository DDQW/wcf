[package]
name = "app"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shared.workspace = true
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Window", "Document", "Element", "HtmlElement", "Node", "NodeList",
    "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "HtmlFormElement",
    "HtmlVideoElement", "HtmlMediaElement", "HtmlAudioElement", "HtmlImageElement",
    "HtmlDivElement", "HtmlAnchorElement", "HtmlIFrameElement",
    "WebSocket", "MessageEvent", "CloseEvent", "BinaryType",
    "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit",
    "DomRect", "Storage", "Location", "History", "Navigator", "Clipboard",
    "Event", "EventTarget", "KeyboardEvent", "MouseEvent", "FocusEvent", "InputEvent",
    "TouchEvent", "TouchList", "Touch", "WheelEvent",
    "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition", "ScrollToOptions",
    "XmlHttpRequest", "XmlHttpRequestUpload", "XmlHttpRequestEventTarget", "ProgressEvent",
    "FormData", "File", "FileList", "Blob", "DragEvent", "DataTransfer", "Url",
    "Notification", "NotificationOptions", "NotificationPermission",
    "Performance", "CssStyleDeclaration", "VisibilityState", "DocumentFragment",
    "ClipboardEvent", "CustomEvent", "Response", "Headers", "Request", "RequestInit",
] }
console_error_panic_hook = { workspace = true, optional = true }

backend = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }
tower-sessions = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook"]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:backend",
    "dep:tower-sessions",
    "dep:axum",
    "dep:tracing",
]
