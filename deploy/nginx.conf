# nginx in front of wcf. Replace community.example.org and the certificate
# paths (e.g. from certbot), then: nginx -t && systemctl reload nginx
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name community.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name community.example.org;

    ssl_certificate     /etc/letsencrypt/live/community.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/community.example.org/privkey.pem;

    # Upload size is limited in the admin settings; nginx streams bodies through.
    client_max_body_size 0;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Realtime (/ws): chat, presence, calls and watch rooms need WebSockets.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The Host header must be passed on (same-origin check for uploads).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # Server-side rendering streams pages; video uses range requests.
        proxy_buffering off;
    }
}
